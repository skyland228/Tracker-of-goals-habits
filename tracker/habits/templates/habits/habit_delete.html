{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Удалить привычку?</h2>
    <div class="card {% if habit.goal.general_goal.theme == 'Здоровье' %}habit-health
        {% elif habit.goal.general_goal.theme == 'Программирование' %}habit-programming
        {% endif %}">
        <div class="card-body">
            <h5>{{ habit.name }}</h5>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Да, удалить</button>
                <a href="{% url 'habits:habits' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
