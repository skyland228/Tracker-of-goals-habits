{% extends 'base.html' %}

{% block content %}
<form method="POST">
    {% csrf_token %}
    {% for field in form %}
    <div class="form-group">{{ field.as_field_group }}</div>
    {% endfor %}
    <button type="submit">
        Сохранить изменения
    </button>
</form>
<p><a href="{% url 'users:password_change' %}">Сменить пароль</a></p>
{% endblock %}
